[package]
name = "home-on-the-range"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local encrypted context shared through scoped application access"

[lib]
name = "hotr"

[[bin]]
name = "hotr"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["sqlcipher", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
clap = { version = "=4.6.6", features = ["derive"] }
rpassword = "=7.5.4"
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
portable-pty = "=0.9.0"

[profile.release]
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
